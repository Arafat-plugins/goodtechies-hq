; GoodTechies HQ: Reverb websocket server (Phase 6). install.sh replaces __APP_DIR__ and
; installs this as /etc/supervisor/conf.d/hq-reverb.conf.
;
; autostart=false, and that is not "not finished yet" — it is the polling mode.
; BROADCAST_CONNECTION in .env decides whether this program runs at all:
;
;   BROADCAST_CONNECTION=reverb   install.sh and deploy.sh start (and restart) it
;   anything else                 they STOP it, and the bell polls
;
; So flipping .env and releasing is the whole of the switch; nobody edits this file to change
; mode. `docs/runbooks/realtime.md` is the page to read at 2am.
;
; --host=127.0.0.1 is deliberate and is asserted by install.sh's assert_local_only: Nginx is
; the only thing this box exposes (Part B §4), and it proxies /app and /apps here.
;
; numprocs stays 1. Reverb holds every connection in one process's memory, so a second one
; would be a second server that cannot see the first one's subscribers — scaling across
; processes needs REVERB_SCALING_ENABLED and Redis, which one box with fifteen people does
; not. minfds is raised because every open tab is a file descriptor.
;
; stopwaitsecs is short on purpose: a restart drops every socket, and every client reconnects
; by itself within seconds. Waiting politely for them would only make a deploy slower.

[program:hq-reverb]
command=php __APP_DIR__/artisan reverb:start --host=127.0.0.1 --port=8080
directory=__APP_DIR__
user=www-data
numprocs=1
autostart=false
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=10
minfds=10000
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/hq-reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
