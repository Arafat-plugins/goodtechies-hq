; GoodTechies HQ: Reverb websocket server. install.sh replaces __APP_DIR__ and
; installs this as /etc/supervisor/conf.d/hq-reverb.conf.
; autostart=false: enabled in Phase 6 when Reverb is installed.
; deploy.sh restarts it only when `artisan reverb:start` exists.

[program:hq-reverb]
command=php __APP_DIR__/artisan reverb:start --host=127.0.0.1 --port=8080
directory=__APP_DIR__
user=www-data
numprocs=1
autostart=false
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
minfds=10000
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/hq-reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
