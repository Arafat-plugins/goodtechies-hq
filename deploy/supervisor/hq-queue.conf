; GoodTechies HQ: queue worker. install.sh replaces __APP_DIR__ and installs this
; as /etc/supervisor/conf.d/hq-queue.conf. deploy.sh runs `artisan queue:restart`
; on every release; Supervisor then starts a fresh worker.

[program:hq-queue]
command=php __APP_DIR__/artisan queue:work redis --tries=3 --sleep=3 --max-time=3600
directory=__APP_DIR__
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/hq-queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
