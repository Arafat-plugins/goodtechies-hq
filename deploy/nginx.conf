# GoodTechies HQ: Nginx site template.
# install.sh replaces __DOMAIN__ and __APP_DIR__ and installs the result as
# /etc/nginx/sites-available/goodtechies-hq. Certbot adds the 443 server later.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __APP_DIR__/public;
    index index.php;
    charset utf-8;

    server_tokens off;
    client_max_body_size 50M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff2;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Vite output has hashed file names, so it can be cached for a long time.
    location ^~ /build/ {
        try_files $uri =404;
        expires max;
        access_log off;
    }

    # Reverb (Phase 6). Two locations, because the Pusher protocol Reverb speaks has two:
    #
    #   /app/{key}          the websocket the BROWSER upgrades to
    #   /apps/{id}/events   the HTTP API this application posts a broadcast to
    #
    # Both proxy to the Reverb process on the loopback (deploy/supervisor/hq-reverb.conf).
    # Both return 502 while Reverb is stopped, which is what a polling deployment looks like
    # and is not an error — the browser never opens either one on a polling build, because
    # VITE_REALTIME said so when the assets were compiled.
    #
    # `proxy_read_timeout 3600s` is the line this block exists to get right. Nginx closes a
    # proxied connection that has been silent for this long, and a websocket is silent between
    # heartbeats — Reverb's default ping interval is 60 seconds, so the old 60s value here
    # raced its own keep-alive and dropped every idle tab roughly once a minute. The client
    # reconnects and the bell falls back to polling in the gap, so the symptom was not an
    # error anywhere: it was a socket that worked and a log full of reconnects.
    location ^~ /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # A websocket is a stream. Buffering it would hold frames back until a buffer filled.
        proxy_buffering off;
    }

    location ^~ /apps/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        internal;
    }

    # Any other .php file is not served.
    location ~ \.php$ {
        return 404;
    }

    # Hidden files (.env, .git, …) are never served; ACME challenges are.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
