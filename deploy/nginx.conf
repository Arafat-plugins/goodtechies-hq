# GoodTechies HQ: Nginx site template.
# install.sh replaces __DOMAIN__ and __APP_DIR__ and installs the result as
# /etc/nginx/sites-available/goodtechies-hq. Certbot adds the 443 server later.
#
# On an IP install (no domain yet) __DOMAIN__ is the server's IPv4 address and this stays the
# only server: plain http, and the HSTS map below sends nothing. No `default_server` on purpose:
# Nginx matches an exact server_name before it falls back to a default_server, so this block
# answers http://<ip> even when another site on the box is the default, and never takes over
# requests for another site's names.

# HSTS, and the reason it is a map rather than a plain add_header (Phase 12, security pass).
#
# `Strict-Transport-Security` means something only when it arrives over HTTPS: a UA must ignore
# it on a non-secure transport (RFC 6797 §7.2). This file as shipped is the **port 80** server,
# because Certbot has not run yet — so an unconditional add_header here would send the header on
# every plain-HTTP response, where it is noise that reads like a guarantee. The map makes the
# value empty unless $scheme is https, and nginx omits a header whose value is empty. After
# `certbot --nginx --redirect` has converted this block to 443 and added its own 80 redirect, the
# same line starts doing its job, with nothing to remember to come back and change.
#
# `map` belongs in the http context, which is where this file is included from
# (`include /etc/nginx/sites-enabled/*;`), so it sits outside the server block.
#
# One year, no `includeSubDomains`, no `preload`:
#   - a year is the usual value and the one preload lists ask for;
#   - `includeSubDomains` would speak for every sibling name under this domain, which this
#     application does not own — the client's marketing site may not be on HTTPS;
#   - `preload` is close to irreversible. It is a decision for the client, not a default.
# **Rolling it back** means setting the value below to "max-age=0" and leaving it there long
# enough for every browser to see it once; removing the line only lets the old one run out.
#
# This is also the deploy half of POLISH-BACKLOG §E.13. The Back-button protection on a
# first-sign-in password falls back to PLAINTEXT when `crypto.subtle` is missing, which is what a
# non-secure origin looks like to the browser. Three things together close that: HSTS here,
# certbot's HTTP→HTTPS redirect (install.sh passes `--redirect`), and `SESSION_SECURE_COOKIE=true`
# in .env.production.example — which is the one that cannot be skipped quietly, because a secure
# cookie is simply not sent over plain HTTP and nobody can hold a session there at all.
map $scheme $hq_hsts {
    default "";
    https   "max-age=31536000";
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __APP_DIR__/public;
    index index.php;
    charset utf-8;

    server_tokens off;
    client_max_body_size 50M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $hq_hsts always;

    # The Content-Security-Policy is NOT here. It is set by
    # app/Http/Middleware/ContentSecurityPolicy.php, because its script-src carries the sha256 of
    # an inline script `resources/views/app.blade.php` renders — a coupling that has to be
    # testable, and a policy pinned in a file no test can reach is a policy that silently stops
    # matching the page. The middleware is registered globally in bootstrap/app.php, so it covers
    # every response PHP produces, 404s included. Anything nginx answers by itself — a static
    # asset under /build/, its own error pages — carries no CSP and needs none.
    #
    # `FileService::download()` sets a much tighter CSP of its own on the bytes it streams. Do not
    # add a policy at this level: two Content-Security-Policy headers are enforced as the
    # INTERSECTION of both, so one added here would silently narrow that one too.

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff2;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Vite output has hashed file names, so it can be cached for a long time.
    location ^~ /build/ {
        try_files $uri =404;
        expires max;
        access_log off;
    }

    # Reverb (Phase 6). Two locations, because the Pusher protocol Reverb speaks has two:
    #
    #   /app/{key}          the websocket the BROWSER upgrades to
    #   /apps/{id}/events   the HTTP API this application posts a broadcast to
    #
    # Both proxy to the Reverb process on the loopback (deploy/supervisor/hq-reverb.conf).
    # Both return 502 while Reverb is stopped, which is what a polling deployment looks like
    # and is not an error — the browser never opens either one on a polling build, because
    # VITE_REALTIME said so when the assets were compiled.
    #
    # `proxy_read_timeout 3600s` is the line this block exists to get right. Nginx closes a
    # proxied connection that has been silent for this long, and a websocket is silent between
    # heartbeats — Reverb's default ping interval is 60 seconds, so the old 60s value here
    # raced its own keep-alive and dropped every idle tab roughly once a minute. The client
    # reconnects and the bell falls back to polling in the gap, so the symptom was not an
    # error anywhere: it was a socket that worked and a log full of reconnects.
    location ^~ /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # A websocket is a stream. Buffering it would hold frames back until a buffer filled.
        proxy_buffering off;
    }

    location ^~ /apps/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        # This application's own PHP-FPM pool (install.sh writes it, sized for the box), so its
        # limits never change another site's `www` pool.
        fastcgi_pass unix:/run/php/php8.3-fpm-goodtechies-hq.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Tell PHP when the request arrived over TLS, explicitly (Phase 12, security pass).
        #
        # Laravel decides `$request->isSecure()` from this, and that decides three things that
        # must not be wrong: whether the session cookie's `secure` flag is honoured, whether a
        # `temporarySignedRoute` for a file download is minted as https (a signature over an
        # http URL is checked against an http URL and a redirect breaks it), and whether
        # `url()` emits a mixed-content link. Debian's `fastcgi_params` does ship this line, but
        # it is a distribution default underneath a guarantee — `if_not_empty` means it is a
        # no-op on port 80 and correct on 443, so saying it here costs nothing and removes the
        # question.
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_hide_header X-Powered-By;
        internal;
    }

    # Any other .php file is not served.
    location ~ \.php$ {
        return 404;
    }

    # Hidden files (.env, .git, …) are never served; ACME challenges are.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
