<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-text="APP_NAME"></title>
    <link rel="stylesheet" href="../ui/shared.css">
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
</head>
<body style="width: 320px">
    <main class="popup">
        <header class="bar">
            <h1 class="brand" data-text="APP_NAME"></h1>
            <span id="status-chip" class="chip" hidden></span>
        </header>

        <section id="disclosure" class="disclosure" aria-labelledby="disclosure-heading" hidden>
            <div class="disclosure-head">
                <h2 id="disclosure-heading" data-text="DISCLOSURE_HEADING"></h2>
                <button type="button" id="disclosure-ok" class="secondary small" data-text="DISCLOSURE_OK"></button>
            </div>
            <p data-text="DISCLOSURE"></p>
        </section>

        <p id="offline" class="notice" role="status" data-text="OFFLINE" hidden></p>
        <p id="error" class="error" role="alert" hidden></p>

        <!-- Not paired / Reconnect -->
        <section id="pair" class="stack" aria-labelledby="pair-heading" hidden>
            <h2 id="pair-heading"></h2>
            <p id="reconnect-line" class="muted" data-text="RECONNECT_LINE" hidden></p>
            <form id="pair-form" class="stack" novalidate>
                <div>
                    <label for="server" data-text="SERVER_LABEL"></label>
                    <input id="server" name="server" type="url" inputmode="url" autocomplete="url" spellcheck="false" required>
                </div>
                <div>
                    <label for="code" data-text="CODE_LABEL"></label>
                    <input id="code" name="code" type="text" class="code" autocomplete="off" autocapitalize="characters" spellcheck="false" required aria-describedby="where-code">
                </div>
                <div>
                    <label for="device-name" data-text="DEVICE_LABEL"></label>
                    <input id="device-name" name="device_name" type="text" autocomplete="off" required>
                </div>
                <button type="submit" id="connect" class="primary full" data-text="CONNECT"></button>
            </form>
            <details id="where-code">
                <summary data-text="WHERE_CODE"></summary>
                <p class="muted" data-text="WHERE_CODE_ANSWER"></p>
            </details>
        </section>

        <!-- Paired, nothing running -->
        <section id="idle" class="stack" hidden>
            <form id="start-form" class="stack" novalidate>
                <div>
                    <label for="task" data-text="TASK_LABEL"></label>
                    <select id="task" name="task" required></select>
                </div>
                <p id="no-tasks" class="muted" data-text="NO_TASKS" hidden></p>
                <button type="submit" id="start" class="primary full" data-text="START"></button>
            </form>
            <div class="today">
                <p class="today-line time" data-today></p>
                <p class="left-line time" data-left></p>
            </div>
        </section>

        <!-- Running / paused -->
        <section id="run" class="stack" hidden>
            <p id="task-name" class="task-name"></p>
            <p class="counter time" role="timer" aria-live="off">
                <span class="visually-hidden" data-text="TIMER_LABEL"></span>
                <span id="counter"></span>
            </p>
            <div class="row">
                <button type="button" id="pause" class="secondary" data-text="PAUSE"></button>
                <button type="button" id="resume" class="primary" data-text="RESUME" hidden></button>
                <button type="button" id="stop" class="danger" data-text="STOP"></button>
            </div>
            <div class="today">
                <p class="today-line time" data-today></p>
                <p class="left-line time" data-left></p>
            </div>
            <button type="button" id="meeting" class="secondary full" data-text="MEETING_BUTTON"></button>
            <p id="meeting-line" class="meeting-line" hidden>
                <span id="meeting-left" class="time"></span>
                <button type="button" id="meeting-cancel" class="link" data-text="MEETING_CANCEL"></button>
            </p>
        </section>

        <footer class="foot">
            <button type="button" id="settings" class="link">
                <svg aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
                <span data-text="SETTINGS"></span>
            </button>
        </footer>
    </main>
</body>
</html>
