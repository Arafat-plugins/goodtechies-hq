<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-text="OPTIONS_TITLE"></title>
    <link rel="stylesheet" href="../ui/shared.css">
    <link rel="stylesheet" href="options.css">
    <script type="module" src="options.js"></script>
</head>
<body>
    <main class="options">
        <h1 data-text="OPTIONS_TITLE"></h1>

        <section aria-labelledby="device-heading">
            <h2 id="device-heading" data-text="DEVICE_HEADING"></h2>
            <p id="paired" hidden>
                <span data-text="PAIRED_AS"></span>
                <strong id="device-name"></strong>
            </p>
            <p id="not-paired" class="muted" data-text="NOT_PAIRED" hidden></p>
            <button type="button" id="disconnect" class="danger" data-text="DISCONNECT" hidden></button>
            <p id="device-status" role="status"></p>
        </section>

        <section aria-labelledby="server-heading">
            <h2 id="server-heading" data-text="SERVER_HEADING"></h2>
            <form id="server-form" class="server-form" novalidate>
                <label for="server" data-text="SERVER_LABEL"></label>
                <div class="inline">
                    <input id="server" name="server" type="url" inputmode="url" autocomplete="url" spellcheck="false" aria-describedby="server-note">
                    <button type="submit" id="save" class="primary" data-text="SAVE"></button>
                </div>
                <p id="server-note" class="muted" data-text="SERVER_LOCKED" hidden></p>
                <p id="server-status" role="status"></p>
            </form>
        </section>

        <section aria-labelledby="disclosure-heading">
            <h2 id="disclosure-heading" data-text="DISCLOSURE_HEADING"></h2>
            <p data-text="DISCLOSURE"></p>
        </section>

        <section aria-labelledby="warning-heading">
            <h2 id="warning-heading" data-text="WARNING_HEADING"></h2>
            <p data-text="WARNING"></p>
        </section>

        <section aria-labelledby="limits-heading">
            <h2 id="limits-heading" data-text="LIMITS_HEADING"></h2>
            <ul>
                <li data-text="LIMIT_DESKTOP_CALLS"></li>
                <li data-text="LIMIT_AUDIBLE"></li>
            </ul>
        </section>

        <section aria-labelledby="install-heading">
            <h2 id="install-heading" data-text="INSTALL_HEADING"></h2>
            <ol id="install-steps"></ol>
        </section>

        <footer class="muted">
            <span data-text="APP_NAME"></span>
            · <span data-text="VERSION_LABEL"></span>
            <span class="tabular" data-text="VERSION"></span>
        </footer>
    </main>
</body>
</html>
