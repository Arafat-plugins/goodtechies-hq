<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>e2e video</title></head>
<body>
<canvas id="c" width="160" height="90"></canvas>
<video id="v" autoplay muted playsinline></video>
<script>
    // A <video> fed by a canvas stream; the canvas is repainted every frame
    // so the element gets data (readyState >= 2) and keeps playing.
    const canvas = document.getElementById('c');
    const g = canvas.getContext('2d');
    let n = 0;
    (function paint() {
        n = (n + 1) % 360;
        g.fillStyle = `hsl(${n}, 70%, 50%)`;
        g.fillRect(0, 0, canvas.width, canvas.height);
        requestAnimationFrame(paint);
    })();
    const video = document.getElementById('v');
    video.srcObject = canvas.captureStream(10);
    video.play().catch(() => {});
</script>
</body>
</html>
